<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>overlay</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Compositing two images needs a decoder, and Node has none built in. Chromium
// is already a dependency of every other tool here, so the compositing happens
// in a page and the driver just saves the result.
window.__overlay = async function (aURL, bURL, mode, opacity, alignA, alignB) {
  const load = (u) => new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u;
  });
  const [a, b] = await Promise.all([load(aURL), load(bURL)]);
  const W = Math.max(a.width, b.width), H = Math.max(a.height, b.height);
  const c = document.getElementById('c');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });

  const draw = (img, align) => {
    // Alignment is by a named anchor rather than by top-left, because two
    // renders of different sizes still share a ground line and a centre line.
    let dx = 0, dy = 0;
    if (align === 'centre') { dx = (W - img.width) / 2; dy = (H - img.height) / 2; }
    else if (align === 'bottom-centre') { dx = (W - img.width) / 2; dy = H - img.height; }
    ctx.drawImage(img, dx, dy);
    return { dx, dy };
  };

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  if (mode === 'blend') {
    draw(a, alignA);
    ctx.globalAlpha = opacity;
    draw(b, alignB);
    ctx.globalAlpha = 1;
  } else if (mode === 'diff') {
    // Absolute difference. Where the two agree the result is black, so any
    // bright pixel is a real discrepancy and nothing else.
    draw(a, alignA);
    const ia = ctx.getImageData(0, 0, W, H);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    draw(b, alignB);
    const ib = ctx.getImageData(0, 0, W, H);
    const out = ctx.createImageData(W, H);
    let changed = 0;
    for (let i = 0; i < out.data.length; i += 4) {
      const dr = Math.abs(ia.data[i] - ib.data[i]);
      const dg = Math.abs(ia.data[i + 1] - ib.data[i + 1]);
      const db = Math.abs(ia.data[i + 2] - ib.data[i + 2]);
      const d = Math.max(dr, dg, db);
      if (d > 8) changed++;
      // Amplified, because a 6-pixel geometry shift is a small difference in
      // absolute terms and the whole point is to make it impossible to miss.
      const v = Math.min(255, d * 3);
      out.data[i] = v; out.data[i + 1] = v * 0.6; out.data[i + 2] = v * 0.2;
      out.data[i + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
    return { width: W, height: H, changedPixels: changed,
      changedFraction: +(changed / (W * H)).toFixed(5) };
  } else {
    // 'edges': the second image reduced to its outline over the first, which is
    // how a technical drawing is checked against a render without the drawing's
    // fill hiding what is underneath.
    draw(a, alignA);
    const base = ctx.getImageData(0, 0, W, H);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    draw(b, alignB);
    const top = ctx.getImageData(0, 0, W, H);
    const lum = (d, i) => (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114);
    const out = ctx.createImageData(W, H);
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = (y * W + x) * 4;
        const gx = lum(top.data, i + 4) - lum(top.data, i - 4);
        const gy = lum(top.data, i + W * 4) - lum(top.data, i - W * 4);
        const e = Math.min(255, Math.hypot(gx, gy) * 2);
        const k = e / 255;
        out.data[i] = base.data[i] * (1 - k) + 255 * k;
        out.data[i + 1] = base.data[i + 1] * (1 - k) + 40 * k;
        out.data[i + 2] = base.data[i + 2] * (1 - k) + 40 * k;
        out.data[i + 3] = 255;
      }
    }
    ctx.putImageData(out, 0, 0);
  }
  return { width: W, height: H };
};
</script>
</body>
</html>
