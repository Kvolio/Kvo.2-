<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiger — orthographic verification</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.js",
    "three/addons/": "/vendor/three/addons/"
  }
}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<script type="module">
// ===========================================================================
//  ORTHOGRAPHIC VERIFICATION PAGE
//
//  Not the game. A bare scene containing nothing but the Tiger, rendered in
//  TRUE orthographic projection at an exact, declared metres-per-pixel, so an
//  output can be laid directly over a technical drawing and the difference
//  measured rather than argued about.
//
//  Two products:
//    * the renders, for the proportion and silhouette critics;
//    * measurements, taken from the geometry itself, so a dimensional error is
//      a number and not an impression.
// ===========================================================================

import * as THREE from 'three';
import { buildTiger } from '/src/render/TigerModel.js';
import * as TEX from '/src/render/Textures.js';

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;   // measurement, not beauty
// Shadows ON, and it matters: without them the plan view showed no turret at
// all. Turret roof and hull roof are the same material, both face straight up,
// and under flat light a 0.77 m step between them produces no tonal difference
// whatsoever — the one view that settles where the turret sits was blank.
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

// Neutral studio light. Deliberately flat and even: this pass is about SHAPE,
// and a dramatic key light hides a proportion error behind a shadow.
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-6, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7; key.shadow.camera.right = 7;
key.shadow.camera.top = 7; key.shadow.camera.bottom = -7;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 30;
key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 1.0);
fill.position.set(7, 4, -6);
scene.add(fill);
scene.add(new THREE.HemisphereLight(0xdfe4ea, 0x606058, 1.4));

let tiger = null;
const silhouetteMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const originalMats = new Map();

/**
 * Views. `mpp` is metres per pixel and is the same for every view, so all five
 * outputs share one scale and can be compared against each other and against a
 * drawing without rescaling anything.
 *
 * `screenRight` and `screenUp` are the world directions that map to +x and +y
 * on the image. They are recorded because a plan view can be silently mirrored
 * and nobody notices until the machine gun is on the wrong side.
 */
const MPP = 0.005;                        // 5 mm per pixel
const VIEWS = {
  front: { eye: [0, 1.75, 14], target: [0, 1.75, 0], up: [0, 1, 0], w: 4.5, h: 4.0 },
  rear:  { eye: [0, 1.75, -14], target: [0, 1.75, 0], up: [0, 1, 0], w: 4.5, h: 4.0 },
  // The vehicle frame is right-handed with forward along +Z, so the crew's LEFT
  // is +X. The camera therefore stands at +X to photograph the tank's left side.
  // Named the other way round these two views quietly lie to a critic checking
  // which side the bow machine gun is on — and a photograph settles it: a tank
  // whose gun points to the right of the frame is showing you its RIGHT side.
  // The side and plan frustums are centred 0.9 m FORWARD of the hull centre and
  // widened to 10.4 m, because the vehicle is not centred on its own origin:
  // it runs from the Feifel drums at -3.48 m to the muzzle at +5.29 m. Framed
  // on the origin at 9.6 m the muzzle brake fell outside the picture — on the
  // one view a critic measures barrel length from.
  left:  { eye: [14, 1.75, 0.9], target: [0, 1.75, 0.9], up: [0, 1, 0], w: 10.4, h: 4.0 },
  right: { eye: [-14, 1.75, 0.9], target: [0, 1.75, 0.9], up: [0, 1, 0], w: 10.4, h: 4.0 },
  top:   { eye: [0, 14, 0.9], target: [0, 0, 0.9], up: [0, 0, 1], w: 4.5, h: 10.4 },
};

function setSilhouette(on) {
  if (!tiger) return;
  tiger.traverse((o) => {
    if (!o.isMesh) return;
    if (on) {
      if (!originalMats.has(o)) originalMats.set(o, o.material);
      o.material = silhouetteMat;
    } else if (originalMats.has(o)) {
      o.material = originalMats.get(o);
    }
  });
  scene.background = new THREE.Color(on ? 0xffffff : 0xb9bec4);
  key.visible = !on;
  fill.visible = !on;
  scene.traverse((o) => { if (o.isHemisphereLight) o.visible = !on; });
}

function renderView(name) {
  const v = VIEWS[name];
  const W = Math.round(v.w / MPP);
  const H = Math.round(v.h / MPP);
  canvas.width = W; canvas.height = H;
  canvas.style.width = `${W}px`; canvas.style.height = `${H}px`;
  renderer.setSize(W, H, false);

  const cam = new THREE.OrthographicCamera(-v.w / 2, v.w / 2, v.h / 2, -v.h / 2, 0.1, 60);
  cam.position.set(...v.eye);
  cam.up.set(...v.up);
  cam.lookAt(...v.target);
  cam.updateMatrixWorld(true);
  renderer.render(scene, cam);

  // Where the world origin, and the ground line, land in the image.
  const e = new THREE.Vector3(0, 0, 0).project(cam);
  const g = new THREE.Vector3(0, 0, 0);
  const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0);
  const up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
  return {
    view: name, width: W, height: H, metresPerPixel: MPP,
    worldWidth: v.w, worldHeight: v.h,
    frustumCentre: v.target,
    originPx: [(e.x * 0.5 + 0.5) * W, (1 - (e.y * 0.5 + 0.5)) * H],
    screenRight: right.toArray().map((n) => +n.toFixed(3)),
    screenUp: up.toArray().map((n) => +n.toFixed(3)),
    groundLinePx: (1 - (new THREE.Vector3(0, 0, 0).project(cam).y * 0.5 + 0.5)) * H,
  };
}

/** Axis-aligned world bounding box of an object, in metres. */
function bbox(obj) {
  if (!obj) return null;
  const b = new THREE.Box3().setFromObject(obj);
  if (!isFinite(b.min.x)) return null;
  const s = b.getSize(new THREE.Vector3());
  const c = b.getCenter(new THREE.Vector3());
  const r = (n) => +n.toFixed(4);
  return {
    min: b.min.toArray().map(r), max: b.max.toArray().map(r),
    size: s.toArray().map(r), centre: c.toArray().map(r),
  };
}

/**
 * Measurements taken from the geometry, not from the render. These are what the
 * proportion critic compares against docs/TIGER-CONFIGURATION.md.
 */
function measure() {
  const u = tiger.userData;
  let tris = 0, meshes = 0;
  tiger.traverse((o) => {
    if (!o.isMesh) return;
    meshes++;
    const g = o.geometry;
    const n = g.index ? g.index.count / 3 : g.attributes.position.count / 3;
    tris += n * (o.isInstancedMesh ? o.count : 1);
  });

  const whole = bbox(tiger);
  // Road wheels: every direct child of a running-gear group, so wheel centres
  // and diameters come out of the actual geometry rather than the source.
  const wheels = [];
  for (const c of (u.gear?.right?.userData?.wheels || [])) {
    const b = bbox(c);
    if (b) wheels.push({ centre: b.centre, diameter: +Math.max(b.size[1], b.size[2]).toFixed(4) });
  }
  wheels.sort((a, b) => b.centre[2] - a.centre[2]);

  return {
    triangles: Math.round(tris),
    meshes,
    overall: whole,
    // Raw bounding box, so it includes the Feifel cylinders on the rear plate.
    lengthWithGun: whole ? +(whole.max[2] - whole.min[2]).toFixed(4) : null,
    // The published figure: muzzle to the rear ARMOUR PLATE, which is what a
    // wartime data sheet measures and what the Feifel gear hangs off the back of.
    lengthGunForward: whole ? +(whole.max[2] + 3.158).toFixed(4) : null,
    widthOverTracks: whole ? +(whole.max[0] - whole.min[0]).toFixed(4) : null,
    heightToCupola: whole ? +whole.max[1].toFixed(4) : null,
    groundClearanceLowest: whole ? +whole.min[1].toFixed(4) : null,
    parts: {
      turret: bbox(u.turret),
      mantlet: bbox(u.mantlet),
      gun: bbox(u.gun),
      cupola: bbox(u.cupola),
      trackLeft: bbox(u.tracks?.left),
      trackRight: bbox(u.tracks?.right),
      gearRight: bbox(u.gear?.right),
    },
    roadWheels: wheels,
  };
}

window.__ortho = {
  ready: false,
  renderView,
  setSilhouette,
  measure,
  views: Object.keys(VIEWS),
  metresPerPixel: MPP,
};

(async function init() {
  await TEX.warmup(() => {});
  tiger = buildTiger({ lod: 0 });
  tiger.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(tiger);
  scene.background = new THREE.Color(0xb9bec4);
  window.__ortho.ready = true;
})();
</script>
</body>
</html>
